<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - NextStep</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-info">

            <div class="auth-logo">
                🚀 NextStep
            </div>

            <h1>Create a New Password</h1>

            <p>
                Choose a strong new password for your
                NextStep account.
            </p>

            <div class="auth-features">

                <div class="auth-feature">

                    <span>🛡️</span>

                    <div>

                        <strong>Strong Password</strong>

                        <small>
                            Use at least 8 characters.
                        </small>

                    </div>

                </div>


                <div class="auth-feature">

                    <span>🚀</span>

                    <div>

                        <strong>Continue Your Journey</strong>

                        <small>
                            Login again after resetting
                            your password.
                        </small>

                    </div>

                </div>

            </div>

        </div>


        <!-- Reset Password Card -->
        <div class="auth-card">

            <div class="auth-card-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h2>Reset Password</h2>

                <p>
                    Enter and confirm your new password.
                </p>

            </div>


            <form
                method="POST"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Reset Password →
                </button>

            </form>


            <p class="auth-back">

                <a href="{{ url_for('login') }}">
                    ← Back to Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
